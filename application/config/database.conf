# 数据库连接。生产用环境变量覆盖，不要把凭据写进仓库：
#   NETON_DATABASE__DEFAULT__URI=postgresql://user:pass@host:5432/dbname
# 下面的默认值仅供本地开发（docker compose 会注入上述环境变量）。
[default]
driver = "POSTGRESQL"
uri = "postgresql://newgate:newgate@localhost:5432/newgate"
debug = false

[migration]
history_table = "neton_schema_history"
