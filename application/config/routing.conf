# 路由组配置
debug = false

[[groups]]
group = "admin"
mount = "/admin"
requireAuth = true

[[groups]]
group = "app"
mount = "/app"
requireAuth = true

# 账号模块的通用经营者入口：会员用普通账号登录后管理自己的业务（与 /app 同一种令牌，与 /admin 完全独立）。
# NetonAPI 当前没有挂任何接口；账号模块的令牌域登记了这个组，所以保留。
[[groups]]
group = "manage"
mount = "/manage"
requireAuth = true

[[groups]]
group = "open"
mount = "/platform"

# NetonAPI LLM 网关：挂载根路径（独占 /v1 前缀），认证走 gateway 组的 sk- TokenGuard
[[groups]]
group = "gateway"
mount = "/"
requireAuth = true
