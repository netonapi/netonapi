# 路由组配置
debug = false

[[groups]]
group = "admin"
mount = "/admin"
requireAuth = true

[[groups]]
group = "app"
mount = "/app"
requireAuth = true

# OP-C-C: 经营者管理中心 (代理 / 俱乐部 owner+admin / 联盟经营者).
# 普通用户 token（与 /app 同 token），但 endpoint 内部按
# game_club_member.role / game_agent.user_id / game_alliance_member 反查保护.
# 跟 /admin (平台后台, system_user token) 完全独立.
# 包路径 controller.manage.* 自动归 manage 组 (inferRouteGroup 按包名匹配 configuredGroups).
[[groups]]
group = "manage"
mount = "/manage"
requireAuth = true

[[groups]]
group = "open"
mount = "/platform"

# NetonAPI LLM 网关：挂载根路径（独占 /v1 前缀），认证走 gateway 组的 sk- TokenGuard
[[groups]]
group = "gateway"
mount = "/"
requireAuth = true
