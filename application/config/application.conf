# NetonAPI —— LLM API 中转站
# JWT + PostgreSQL + 三文件日志

[application]
name = "netonapi"
debug = false

[server]
port = 8800
host = "0.0.0.0"

# CORS 配置：见 Main.kt 的 http { cors { ... } } DSL 块。
#
# ⚠️ 之前尝试过 [cors] TOML 段，发现 neton TomlParser（v1.1 最小实现）
# 不支持 array 语法 —— allowedOrigins = [...] 会被读成字符串而非 List，
# 导致 ConfigLoader 解析失败但 HttpComponent.resolveCorsConfig 仍然返回
# 一个全默认 CorsConfig（allowedOrigins=["*"]），并且会覆盖 DSL（见
# HttpComponent.kt:36 的 `resolveCorsConfig(appConfig) ?: config.corsConfig`）。
# 所以这里必须留空，让 DSL 生效。

[security.jwt]
# Override via env: NETON_SECURITY__JWT__SECRETKEY=<your-secret>
secretKey = "REPLACE_ME_SET_NETON_SECURITY__JWT__SECRETKEY"
headerName = "Authorization"
tokenPrefix = "Bearer "

# Unified token (spec TOKEN_UNIFICATION_SPEC v1.3 Phase A).
#
# 默认 dormant：enabled=false + verify_legacy_jwt=true → 现网 HS256 行为完全不变。
#
# 切换组合（DispatchingJwtAuthenticator 路由规则）：
#   enabled=false, verify_legacy_jwt=true   ← 默认。仅 legacy 接受
#   enabled=true,  verify_legacy_jwt=true   ← phase B 起。双验
#   enabled=true,  verify_legacy_jwt=false  ← phase C。仅 unified 接受
#   enabled=false, verify_legacy_jwt=false  ← FAIL-FAST，启动直接抛
[security.unified_token]
# Phase B（双验过渡态）：unified token + legacy HS256 都接受。admin AuthLogic 当前
# 仍签 legacy HS256，关掉 verify_legacy_jwt 会让 admin 登录后第一次拿 access token
# 立刻被拒（10000 Authentication required）。Phase C（仅 unified）需要先把 admin
# AuthLogic 改成调 server /api/service/auth/issue，见 TOKEN_UNIFICATION_PHASE_A_APP_PLAN。
# NetonAPI 不启用 unified token：纯 legacy HS256 行为，不拉 JWKS/introspect。
enabled = false
verify_legacy_jwt = true
jwks_url = "http://localhost:9090/api/service/auth/jwks"
introspect_url = "http://localhost:9090/api/service/auth/introspect"
introspect_enabled = true
session_cache_ttl_secs = 30
jwks_cache_ttl_secs = 3600

# 运维出站策略（neton-http EgressSettings）：后台运行期可改的出站地址（网关渠道 baseUrl / proxyUrl / token_uri、
# 短信与邮件渠道、支付网关）走受控客户端，默认只连公网 80/443。自托管内网上游在这里精确放行（逗号分隔），
# 后台改不了它；任一放行项非空时启动打 WARN。环境变量：NETON_EGRESS__ALLOWED_NETWORKS=10.20.0.0/16。
[egress]
allowed_ports = "80,443"
allowed_hosts = ""
allowed_networks = ""

[database]
driver = "POSTGRESQL"
# Override via env: NETON_DATABASE__URI=postgresql://user:pass@host:5432/dbname
uri = "postgresql://netonapi:netonapi@localhost:5432/netonapi"
debug = false

[logging]
level = "INFO"

# module-system 网络准入：按路由组匹配，先于认证。配置变更需重启。
# enabled=true 且 allowlist="" 表示拒绝该组所有请求，包括已有 Token。
# 逗号分隔 IPv4/IPv6/CIDR；请替换为真实出口地址，勿照抄示例网段。
[security.network.admin]
enabled = false
allowlist = ""

# 公网会员端独立配置，默认不限制。
[security.network.app]
enabled = false
allowlist = ""

# 验证码发送额度（module-system，规范 auth-abuse-protection §5）。每个通道（短信、邮件）分别计数。
# daily_limit_global 是全站每天发码上限：被刷时它决定最坏一天的短信账单，0 = 不限，生产不要用 0。
# 默认 1000 条/天，按短信预算调整（环境变量 NETON_SECURITY__VERIFICATION__DAILY_LIMIT_GLOBAL）。
[security.verification]
resend_cooldown_seconds = 60
daily_limit_per_recipient = 10
daily_limit_global = 1000

[logging.async]
enabled = false
queueSize = 8192
flushEveryMs = 200
flushBatchSize = 64
shutdownFlushTimeoutMs = 2000

[[logging.sinks]]
name = "access"
file = "logs/access.log"
levels = "INFO"
route = "http.access"

[[logging.sinks]]
name = "error"
file = "logs/error.log"
levels = "ERROR,WARN"

[[logging.sinks]]
name = "all"
file = "logs/all.log"
levels = "ALL"
