# 文件存储后端（neton-storage / spec MODULE_MEMBER_PROFILE_SPEC §4.2）。
#
# 应用内**唯一**用户态文件上传入口（POST /app/infra/file/upload）使用
# default source。目录布局由 application 脚手架强制：
#   {basePath}/{businessType}/{ownerUid}/{sha256}.{ext}
# 不允许 controller / logic 自行拼路径。
#
# 第一版只配置 local，后续切 S3 / OSS 时改 type 与对应字段即可，
# 业务代码（AppFileLogic / AppFileController）零改动。

[[sources]]
name     = "default"
type     = "local"
basePath = "./storage/app-files"

