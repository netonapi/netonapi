kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.native.ignoreDisabledTargets=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g

# linuxX64 不用 Kotlin/Native 的编译器缓存：debug 链接时缓存里的 cryptography-kotlin 预编译 OpenSSL
# 会被整体链入，与 openssl-kotlin 源码编译的 OpenSSL 符号重复（ld.lld duplicate symbol OPENSSL_*）。
# release 链接本就不走缓存，这里只影响 Linux 上 debug 链接（harness / CI）的速度。
kotlin.native.cacheKind.linuxX64=none
