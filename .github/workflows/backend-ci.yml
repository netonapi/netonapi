name: Backend CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

# Kotlin/Native 一轮几十分钟：同分支的新推送直接取消旧运行，不排队。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 跨仓 checkout 私有 canonical 仓需要 PAT —— GITHUB_TOKEN 只对「跑这个 workflow 的仓」有效。
  # 在 repo secrets 里配 NETON_CI_TOKEN（fine-grained PAT，对 netonframework / neton-application
  # 两个 org 只读即可）；若这些仓全部公开，不配也能跑（自动回落到 GITHUB_TOKEN）。
  NETON_CI_TOKEN: ${{ secrets.NETON_CI_TOKEN || secrets.GITHUB_TOKEN }}

# ── checkout 布局是硬约束，不是风格问题 ──────────────────────────────────────────
# 本仓 settings.gradle.kts 用相对路径装配 canonical 源码：
#   includeBuild("../../Neton/neton")
#   project(":module-system").projectDir = file("../../Neton/neton-application-module-system")
# （module-gateway 是 NetonAPI 独有的模块，就在本仓 module-gateway/ 下，不需要另外 checkout）
# 即「本仓必须在 workspace 下两层，canonical 仓必须在 workspace 的 Neton/ 下」，差一层就解析不到：
#   dist/netonapi-backend    ← 本仓（compile job）
#   NewGate/netonapi-backend ← 本仓（harness job；外层 NewGate = zoujiaqing/nanogate，harness 住在那儿）
#   Neton/*         ← 框架 + neton-ai + geolite4k + application-contract + 六个通用模块，
#                     以及 netonstream 协议栈源码（io / http / tls / websocket / openssl-kotlin）：
#                     框架 gradle.properties 提交的是 netonstream.local=true，按兄弟目录源码装配
# 少 checkout 任何一个模块都会在 Gradle **配置期**直接失败（include 指向的目录不存在）。
# 各模块都是 include(...) 子项目而非 composite build，KSP 随正常任务图生成，
# 因此不需要（也不该有）额外的 KSP 预生成步骤。

jobs:
  compile-and-test:
    name: Compile + unit tests (macOS arm64)
    # macos-15 镜像默认 Xcode 16（macos-14 默认 Xcode 15）
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: dist/netonapi-backend

      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          repository: netonframework/neton
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton

      - name: Checkout geolite4k
        uses: actions/checkout@v4
        with:
          repository: netonframework/geolite4k
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/geolite4k

      - name: Checkout neton-ai
        uses: actions/checkout@v4
        with:
          repository: netonframework/neton-ai
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-ai

      - name: Checkout application-contract
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-contract
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-contract

      - name: Checkout netonstream io
        uses: actions/checkout@v4
        with:
          repository: netonframework/io
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/io

      - name: Checkout netonstream http
        uses: actions/checkout@v4
        with:
          repository: netonframework/http
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/http

      - name: Checkout netonstream tls
        uses: actions/checkout@v4
        with:
          repository: netonframework/tls
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/tls

      - name: Checkout netonstream websocket
        uses: actions/checkout@v4
        with:
          repository: netonframework/websocket
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/websocket

      - name: Checkout openssl-kotlin
        uses: actions/checkout@v4
        with:
          repository: netonframework/openssl-kotlin
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/openssl-kotlin

      - name: Checkout module-system
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-module-system
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-module-system

      - name: Checkout module-infra
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-module-infra
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-module-infra

      - name: Checkout module-account
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-module-account
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-module-account

      - name: Checkout module-member
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-module-member
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-module-member

      - name: Checkout module-payment
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-module-payment
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-module-payment

      - name: Checkout module-platform
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-module-platform
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-module-platform

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Kotlin/Native 首次跑会往 ~/.konan 拉 ~1GB 的 LLVM 与平台依赖；不缓存则每轮 CI 重下。
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('dist/netonapi-backend/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          build-root-directory: dist/netonapi-backend

      - name: Compile application
        working-directory: dist/netonapi-backend
        run: ./gradlew :application:compileKotlinMacosArm64 -Pnetonstream.local.openssl=true

      # 只编译不跑测试等于没有回归保护：账务、流式、限流、IP 信任边界、SSRF 全靠这些断言守住。
      - name: Unit tests
        working-directory: dist/netonapi-backend
        run: ./gradlew :module-gateway:macosArm64Test :module-system:macosArm64Test -Pnetonstream.local.openssl=true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            Neton/neton-application-module-*/build/test-results/**/*.xml
            dist/netonapi-backend/module-gateway/build/test-results/**/*.xml
          retention-days: 7
          if-no-files-found: ignore

  # 可靠性 harness：真实 PostgreSQL + 隔离 Redis + 假上游 + 真实网关，逐场景断言账务/流式/限流。
  # 单元测试覆盖不到「钱是否算对」与「多进程并发下计数是否精确」——这一层必须跑真库真 Redis。
  # 顺带证明 linuxX64 目标能链接、能跑（macOS job 证明不了这件事）。
  reliability-harness:
    name: Reliability harness (Linux, real PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netonapi
          POSTGRES_PASSWORD: netonapi
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout NetonAPI distribution repository
        uses: actions/checkout@v4
        with:
          repository: zoujiaqing/nanogate
          token: ${{ env.NETON_CI_TOKEN }}
          path: NewGate

      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: NewGate/netonapi-backend

      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          repository: netonframework/neton
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton

      - name: Checkout geolite4k
        uses: actions/checkout@v4
        with:
          repository: netonframework/geolite4k
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/geolite4k

      - name: Checkout neton-ai
        uses: actions/checkout@v4
        with:
          repository: netonframework/neton-ai
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-ai

      - name: Checkout application-contract
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-contract
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-contract

      - name: Checkout netonstream io
        uses: actions/checkout@v4
        with:
          repository: netonframework/io
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/io

      - name: Checkout netonstream http
        uses: actions/checkout@v4
        with:
          repository: netonframework/http
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/http

      - name: Checkout netonstream tls
        uses: actions/checkout@v4
        with:
          repository: netonframework/tls
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/tls

      - name: Checkout netonstream websocket
        uses: actions/checkout@v4
        with:
          repository: netonframework/websocket
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/websocket

      - name: Checkout openssl-kotlin
        uses: actions/checkout@v4
        with:
          repository: netonframework/openssl-kotlin
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/openssl-kotlin

      - name: Checkout module-system
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-module-system
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-module-system

      - name: Checkout module-infra
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-module-infra
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-module-infra

      - name: Checkout module-account
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-module-account
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-module-account

      - name: Checkout module-member
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-module-member
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-module-member

      - name: Checkout module-payment
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-module-payment
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-module-payment

      - name: Checkout module-platform
        uses: actions/checkout@v4
        with:
          repository: neton-application/neton-application-module-platform
          token: ${{ env.NETON_CI_TOKEN }}
          path: Neton/neton-application-module-platform

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 同上：linuxX64 的 Kotlin/Native 工具链不缓存就是每轮重下 ~1GB。
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('NewGate/netonapi-backend/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # harness 自己拉起一个隔离 redis-server（独立端口/db/keyPrefix，关持久化），
      # 不用 service 容器：S24 要断言的是键名与 TTL，端口必须确定。
      - name: Ensure redis-server is available
        run: command -v redis-server >/dev/null 2>&1 || sudo apt-get install -y redis-server

      - name: Run reliability harness
        working-directory: NewGate
        env:
          NETONAPI_TARGET: linuxX64
          PGUSER: netonapi
          PGPASS: netonapi
          PGHOST: localhost
        run: bash harness/run.sh

      # Outbox store contract against the real PostgreSQL service above（上游 c365c14 的
      # macOS+brew job 移植为本 job 的一步：同一 PG 服务、同一 checkout，不另起 runner）。
      # postgresContractTest 需要一个有 CREATEDB 的角色；官方镜像的 POSTGRES_USER 是超级用户。
      - name: Outbox store contract (real PostgreSQL)
        working-directory: NewGate/netonapi-backend
        env:
          EVENT_DB_URI: postgresql://netonapi:netonapi@localhost:5432/postgres
        run: ./gradlew :module-infra:postgresContractTest --no-daemon -Pnetonstream.local.openssl=true

      - name: Upload harness logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs
          path: NewGate/harness/logs/**/*.log
          retention-days: 7
          if-no-files-found: ignore
